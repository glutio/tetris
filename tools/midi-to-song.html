<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gotetris MIDI to song</title>
<style>
body { font: 15px system-ui, sans-serif; max-width: 960px; margin: 1em auto; padding: 0 1em; background: #fafafc; color: #333; }
h1 { font-size: 1.4em; }
#drop { border: 3px dashed #bbb; border-radius: 1em; padding: 2em; text-align: center; color: #777; cursor: pointer; }
#drop.over { border-color: deeppink; color: deeppink; }
table { border-collapse: collapse; margin: 1em 0; width: 100%; }
td, th { border-bottom: 1px solid #ddd; padding: .3em .5em; text-align: left; }
.row { display: flex; flex-wrap: wrap; gap: 1.2em; align-items: center; margin: .8em 0; }
textarea { width: 100%; height: 12em; font: 13px ui-monospace, Consolas, monospace; box-sizing: border-box; }
button { font: inherit; padding: .4em 1.2em; border-radius: 2em; border: 0; background: deeppink; color: #fff; cursor: pointer; }
input[type=number] { width: 4.5em; }
#info { color: #666; }
.warn { color: #b60; }
</style>
</head>
<body>
<h1>MIDI → gotetris song</h1>
<p>Only for music you may use: public-domain tunes or your own. Drop a <code>.mid</code> file, pick the melody track,
and copy the result into <code>tools/song-test.html</code> to listen, then into <code>Music.songs</code>.</p>

<div id="drop">Drop a MIDI file here or click to choose<input id="file" type="file" accept=".mid,.midi,audio/midi" hidden></div>
<p id="info"></p>

<div id="setup" hidden>
<table id="tracks"><thead><tr><th>Track</th><th>Notes</th><th>Range</th><th>Melody</th><th>Harmony</th></tr></thead><tbody></tbody></table>
<div class="row">
   <label>name <input id="name" value="MySong"></label>
   <label>start at bar <input id="from" type="number" min="1" value="1"></label>
   <label>bars <input id="bars" type="number" min="1" value="16"></label>
   <label>octave shift <input id="shift" type="number" min="-4" max="4" value="0"></label>
   <label>chord every <select id="seg"><option value="4">beat</option><option value="8" selected>2 beats</option><option value="16">bar</option></select></label>
</div>
<p id="warn" class="warn"></p>
<textarea id="out" spellcheck="false" readonly></textarea>
<div class="row"><button id="copy">Copy</button></div>
</div>

<script>
var $id = function(id) { return document.getElementById(id); };
var midi = null;

// --- standard MIDI file reader ---
function parseMidi(buf) {
   var d = new DataView(buf), p = 0;
   var str = function(n) { var s = ""; for (var i = 0; i < n; i++) s += String.fromCharCode(d.getUint8(p++)); return s; };
   var u32 = function() { var v = d.getUint32(p); p += 4; return v; };
   var u16 = function() { var v = d.getUint16(p); p += 2; return v; };
   var vlq = function() { var v = 0, b; do { b = d.getUint8(p++); v = (v << 7) | (b & 127); } while (b & 128); return v; };
   if (str(4) != "MThd") throw new Error("Not a MIDI file");
   var hlen = u32(), format = u16(), ntracks = u16(), division = u16();
   p = 8 + hlen;
   if (division & 0x8000) throw new Error("SMPTE timing isn't supported");
   var res = { tpb: division, tracks: [], tempo: 500000, timeSig: [4, 4] };
   for (var t = 0; t < ntracks && p < d.byteLength; t++) {
      var id = str(4), len = u32(), end = p + len;
      if (id != "MTrk") { p = end; continue; }
      var track = { name: "", notes: [], channels: {} }, now = 0, status = 0, open = {};
      while (p < end) {
         now += vlq();
         var b = d.getUint8(p);
         if (b & 128) { status = b; p++; }
         if (status == 0xFF) {
            var type = d.getUint8(p++), mlen = vlq(), start = p;
            if (type == 3 && !track.name) track.name = str(mlen);
            if (type == 0x51 && !res.tempoSet) { res.tempo = (d.getUint8(start) << 16) | (d.getUint8(start + 1) << 8) | d.getUint8(start + 2); res.tempoSet = true; }
            if (type == 0x58) res.timeSig = [d.getUint8(start), Math.pow(2, d.getUint8(start + 1))];
            p = start + mlen;
            status = 0;
         } else if (status == 0xF0 || status == 0xF7) {
            p += vlq();
            status = 0;
         } else {
            var kind = status >> 4, ch = status & 15;
            var a = d.getUint8(p++), v = (kind == 0xC || kind == 0xD) ? 0 : d.getUint8(p++);
            var key = ch * 128 + a;
            if (kind == 9 && v > 0) {
               if (open[key]) track.notes.push(close(open[key], now));
               open[key] = { start: now, note: a, ch: ch };
               track.channels[ch] = true;
            } else if ((kind == 8 || kind == 9) && open[key]) {
               track.notes.push(close(open[key], now));
               delete open[key];
            }
         }
      }
      p = end;
      if (track.notes.length) res.tracks.push(track);
   }
   function close(n, now) { n.len = now - n.start; return n; }
   res.tracks.forEach(function(tr, i) {
      tr.notes.sort(function(a, b) { return a.start - b.start || b.note - a.note; });
      tr.drums = !!tr.channels[9];
      tr.name = tr.name || "Track " + (i + 1);
   });
   return res;
}

var NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
var NOTE = ["C", "^C", "D", "^D", "E", "F", "^F", "G", "^G", "A", "^A", "B"];
var BUILTIN = { Dm: 38, A7: 45, F: 41, C7: 36, C: 36, Bb: 46, G7: 43, Gm: 43, E: 40, Am: 45 };

function noteName(m) {
   var oct = Math.floor(m / 12) - 1, n = NOTE[m % 12];
   if (oct >= 6) return n.replace(/[A-G]/, function(c) { return c.toLowerCase(); }) + (oct > 6 ? "?" : "");
   return n + ",".repeat(Math.max(0, 5 - oct));
}

function lenText(sixteenths) {
   var e = sixteenths / 2;
   return e == 1 ? "" : e == .5 ? ".5" : String(e);
}

function convert() {
   if (!midi) return;
   var warn = [];
   var q = midi.tpb / 4; // ticks per sixteenth
   var barSteps = Math.round(16 * midi.timeSig[0] / midi.timeSig[1]);
   var from = (Math.max(1, +$id("from").value) - 1) * barSteps;
   var total = Math.max(1, +$id("bars").value) * barSteps;
   total = Math.ceil(total / 8) * 8; // whole 2/4 bars
   var shift = 12 * +$id("shift").value;
   var melIdx = +document.querySelector("input[name=mel]:checked").value;
   var harm = [].slice.call(document.querySelectorAll("input.harm:checked")).map(function(e) { return midi.tracks[+e.value]; });

   // melody: highest note at each sixteenth, cut at the next note, rests in the gaps
   var at = {};
   midi.tracks[melIdx].notes.forEach(function(n) {
      var s = Math.round(n.start / q) - from;
      if (s < 0 || s >= total) return;
      var len = Math.max(1, Math.round(n.len / q));
      if (!at[s] || at[s].note < n.note) at[s] = { note: n.note + shift, len: len };
   });
   var starts = Object.keys(at).map(Number).sort(function(a, b) { return a - b; });
   var tokens = [], pos = 0, high = 0, low = 0;
   var rest = function(n) { while (n > 0) { var r = Math.min(n, 8); tokens.push("z" + lenText(r)); n -= r; } };
   starts.forEach(function(s, i) {
      var nxt = i + 1 < starts.length ? starts[i + 1] : total;
      var n = at[s], len = Math.min(n.len, nxt - s);
      rest(s - pos);
      if (n.note > 95) high++;
      if (n.note < 48) low++;
      tokens.push(noteName(Math.min(95, Math.max(36, n.note))) + lenText(len));
      pos = s + len;
   });
   rest(total - pos);
   if (high) warn.push(high + " notes above B6 – try octave shift −1");
   if (low) warn.push(low + " notes below C3 – try octave shift +1");
   if (!starts.length) warn.push("No melody notes in these bars");

   // chords: weigh the harmony tracks' pitch classes per segment against major/minor/seventh shapes
   var seg = +$id("seg").value, chords = [], roots = {};
   var shapes = [["", [0, 4, 7]], ["m", [0, 3, 7]], ["7", [0, 4, 7, 10]]];
   var prev = null;
   for (var s0 = 0; s0 < total; s0 += seg) {
      var w = new Array(12).fill(0), lowest = 999;
      harm.forEach(function(tr) {
         tr.notes.forEach(function(n) {
            var a = Math.max(n.start / q - from, s0), b = Math.min((n.start + n.len) / q - from, s0 + seg);
            if (b <= a) return;
            w[n.note % 12] += b - a;
            if (n.start / q - from < s0 + seg) lowest = Math.min(lowest, n.note);
         });
      });
      var best = null, sum = w.reduce(function(x, y) { return x + y; }, 0);
      if (sum > 0) {
         for (var r = 0; r < 12; r++) shapes.forEach(function(sh) {
            var hit = 0;
            sh[1].forEach(function(iv) { hit += w[(r + iv) % 12]; });
            var score = hit - (sum - hit) * .7 - (sh[1].length == 4 ? sum * .05 : 0) + (lowest % 12 == r ? sum * .25 : 0);
            if (!best || score > best.score) best = { score: score, name: NAMES[r] + sh[0], root: 36 + r };
         });
      }
      var c = best || prev || { name: "C", root: 36 };
      prev = c;
      if (!(c.name in BUILTIN) || BUILTIN[c.name] != c.root) roots[c.name] = c.root;
      var last = chords[chords.length - 1];
      if (last && last.name == c.name) last.len += seg; else chords.push({ name: c.name, len: seg });
   }
   if (!harm.length) warn.push("No harmony tracks ticked – chords default to C");

   var out = "{\n   name: " + JSON.stringify($id("name").value) +
      ",\n   melody: \"" + tokens.join(" ") + "\"" +
      ",\n   chords: \"" + chords.map(function(c) { return c.name + ":" + c.len / 2; }).join(" ") + "\"" +
      (Object.keys(roots).length ? ",\n   roots: " + JSON.stringify(roots).replace(/,/g, ", ") : "") + "\n}";
   $id("out").value = out;
   $id("warn").textContent = warn.join(" · ");
}

function load(file) {
   file.arrayBuffer().then(function(buf) {
      try { midi = parseMidi(buf); } catch (e) { $id("info").textContent = e.message; return; }
      var bpm = Math.round(60000000 / midi.tempo);
      var lenBars = Math.ceil(Math.max.apply(null, midi.tracks.map(function(t) {
         var n = t.notes[t.notes.length - 1]; return n.start + n.len; })) / (midi.tpb * 4 * midi.timeSig[0] / midi.timeSig[1]));
      $id("info").textContent = file.name + ": " + midi.tracks.length + " tracks, " + midi.timeSig.join("/") +
         ", " + bpm + " bpm (the game sets its own tempo), " + lenBars + " bars";
      $id("name").value = file.name.replace(/\.midi?$/i, "");
      var tbody = document.querySelector("#tracks tbody");
      tbody.innerHTML = "";
      // guess: melody = non-drum track with the highest average pitch
      var mel = 0, bestAvg = -1;
      midi.tracks.forEach(function(t, i) {
         if (t.drums) return;
         var avg = t.notes.reduce(function(a, n) { return a + n.note; }, 0) / t.notes.length;
         if (avg > bestAvg) { bestAvg = avg; mel = i; }
      });
      midi.tracks.forEach(function(t, i) {
         var lo = Math.min.apply(null, t.notes.map(function(n) { return n.note; }));
         var hi = Math.max.apply(null, t.notes.map(function(n) { return n.note; }));
         var tr = document.createElement("tr");
         tr.innerHTML = "<td></td><td>" + t.notes.length + "</td><td>" + (t.drums ? "drums" : NAMES[lo % 12] + (Math.floor(lo / 12) - 1) +
            "–" + NAMES[hi % 12] + (Math.floor(hi / 12) - 1)) + "</td>" +
            '<td><input type="radio" name="mel" value="' + i + '"' + (i == mel ? " checked" : "") + (t.drums ? " disabled" : "") + "></td>" +
            '<td><input type="checkbox" class="harm" value="' + i + '"' + (!t.drums && i != mel ? " checked" : "") + "></td>";
         tr.firstChild.textContent = t.name;
         tbody.appendChild(tr);
      });
      // start at the bar of the first melody note
      var first = midi.tracks[mel].notes[0].start;
      $id("from").value = 1 + Math.floor(first / (midi.tpb * 4 * midi.timeSig[0] / midi.timeSig[1]));
      $id("setup").hidden = false;
      convert();
   });
}

$id("drop").onclick = function() { $id("file").click(); };
$id("file").onchange = function() { if (this.files[0]) load(this.files[0]); };
$id("drop").ondragover = function(e) { e.preventDefault(); this.classList.add("over"); };
$id("drop").ondragleave = function() { this.classList.remove("over"); };
$id("drop").ondrop = function(e) { e.preventDefault(); this.classList.remove("over"); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); };
$id("setup").addEventListener("input", convert);
$id("setup").addEventListener("change", convert);
$id("copy").onclick = function() { $id("out").select(); navigator.clipboard.writeText($id("out").value); };
</script>
</body>
</html>
