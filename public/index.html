<script>
// A tiny stand-in for the handful of jQuery calls gotetris uses.
class Q {
   constructor(els) {
      this.length = 0;
      for (const el of els) if (el) this[this.length++] = el;
   }
   each(fn) {
      for (let i = 0; i < this.length; i++) fn.call(this[i], i, this[i]);
      return this;
   }
   find(sel) {
      const out = [];
      this.each(function() { out.push(...this.querySelectorAll(sel)); });
      return new Q(out);
   }
   closest(sel) {
      const out = [];
      this.each(function() {
         const el = this.closest ? this.closest(sel) : null;
         if (el && !out.includes(el)) out.push(el);
      });
      return new Q(out);
   }
   sort(fn) { Array.prototype.sort.call(this, fn); return this; }
   hasClass(c) { return Array.prototype.some.call(this, el => el.classList.contains(c)); }
   addClass(c) { return this.each(function() { this.classList.add(c); }); }
   removeClass(c) { return this.each(function() { this.classList.remove(c); }); }
   attr(name, value) {
      if (value === undefined) return this[0] && this[0].hasAttribute(name) ? this[0].getAttribute(name) : undefined;
      return this.each(function() { this.setAttribute(name, value); });
   }
   removeAttr(name) { return this.each(function() { this.removeAttribute(name); }); }
   remove() { return this.each(function() { this.remove(); }); }
   append(child) {
      const parent = this[0];
      if (parent) $(child).each(function() { parent.appendChild(this); });
      return this;
   }
   clone(withEvents) {
      return new Q(Array.prototype.map.call(this, el => {
         const copy = el.cloneNode(true);
         if (withEvents) {
            const from = [el, ...el.querySelectorAll("*")], to = [copy, ...copy.querySelectorAll("*")];
            from.forEach((src, i) => (src._q || []).forEach(h => $(to[i]).on(h[0], h[1])));
         }
         return copy;
      }));
   }
   css(prop, value) {
      return this.each(function() { this.style[prop] = typeof value === "number" ? value + "px" : value; });
   }
   _size(dim, value) {
      if (value !== undefined) return this.css(dim, value);
      const el = this[0];
      if (!el) return undefined;
      if (el === window) return dim === "height" ? window.innerHeight : window.innerWidth;
      if (el === document) return dim === "height" ? document.documentElement.scrollHeight : document.documentElement.scrollWidth;
      return el.getBoundingClientRect()[dim];
   }
   height(value) { return this._size("height", value); }
   width(value) { return this._size("width", value); }
   text(value) {
      if (value === undefined) return this[0] ? this[0].textContent : "";
      return this.each(function() { this.textContent = value; });
   }
   html(value) { return this.each(function() { this.innerHTML = value; }); }
   show() {
      return this.each(function() {
         this.style.display = "";
         if (getComputedStyle(this).display === "none") this.style.display = this.tagName === "TD" ? "table-cell" : "block";
      });
   }
   hide() { return this.each(function() { this.style.display = "none"; }); }
   is(sel) {
      if (sel === ":visible") return Array.prototype.some.call(this, el => el.getClientRects().length > 0);
      return Array.prototype.some.call(this, el => el.matches && el.matches(sel));
   }
   on(type, fn) {
      return this.each(function() {
         (this._q = this._q || []).push([type, fn]);
         this.addEventListener(type, function(event) {
            event.originalEvent = event;
            return fn.call(this, event);
         });
      });
   }
   click(fn) { return this.on("click", fn); }
   keydown(fn) { return this.on("keydown", fn); }
   focus() { if (this[0]) this[0].focus(); return this; }
}

function $(what) {
   if (what instanceof Q) return what;
   if (typeof what === "string") {
      if (what.charAt(0) === "<") return new Q([document.createElement(what.replace(/[<\/>\s]/g, ""))]);
      return new Q(document.querySelectorAll(what));
   }
   if (what && what.length !== undefined && !what.nodeType && what !== window) return new Q(what);
   return new Q([what]);
}

<style>

table {
   margin:auto;
   border-spacing: 0px;
}  
v *{
 border: 1px solid red;
}

#layout {
  width:100%
}

#wrap {
   position:relative;
}

#next-well {
  position: absolute;
  left: 2%;
  top: 5%;
}

#next-well .shape 
{
  box-shadow: 1px 1px 1px 0px rgba(0, 0, 0, 0.5);
  opacity:0.5;
}

#elapsed,
#sidebar {
  position:absolute;
  right: 2%;
  top: 5%;
  text-align:center;
  font-family:monospace;
  font-size: 20px;
  font-weight:bold;
  color:rgba(40, 40, 40, 0.5);;
  text-shadow: 1px 1px 6px rgba(50, 50, 50, 0.4);
}

#elapsed {
  top: 20%;
}
.tetris td {
    background-color: #ffdae1;
    border-width: 0.5;
    border-style: outset;
}

.well td.nonempty {
    border-width: 0.5;
    border-style: outset;
    width: 12px;
    height: 12px;
}

.well td.nonempty,
{
    background-color: green;
}
 
 .well td.nonempty.shape {
    background-color: blue;
 }
 
 .well td.nonempty[data-color="B"]
 {
  background-color:blue;
 }
 .well td.nonempty[data-color="I"]
 {
  background-color:red;
 }
 .well td.nonempty[data-color="T"]
 {
  background-color:darkorange;
 }
 .well td.nonempty[data-color="LL"]
 {
  background-color:gray;
 }
 .well td.nonempty[data-color="RL"]
 {
  background-color:magenta;
 }
 .well td.nonempty[data-color="LS"]
 {
  background-color:darkcyan;
 }
 .well td.nonempty[data-color="RS"]
 {
   background-color:green;
 }
 .well td.nonempty[data-color="DOT"]
 {
  background-color:darkmagenta;
 }
 .well td.nonempty[data-color="THAI"]
 {
  background-color:rgb(209, 153, 81);
 }
 .well td.nonempty[data-color="TAK"]
 {
   background-color:black;
   animation: colorchange 5s infinite; /* animation-name followed by duration in seconds*/
         /* you could also use milliseconds (ms) or something like 2.5s */
   -webkit-animation: colorchange 5s infinite; /* Chrome and Safari */
    -webkit-animation-direction: alternate; /* Safari 4.0 - 8.0 */
    animation-direction: alternate;
 }
 
@keyframes colorchange {
      0%   {background: #a79019;}
      25%  {background: #dfbb03;}
      50%  {background: #f8d62d;}
      75%  {background: #ffb400;}
      100% {background: #ff6c00;}
}

 .well td.nonempty[data-color="H"]
 {
   background-color:deeppink;
 }

#above-side-control {
   height: 30%;
}

#bottom-control {
  display:none;
}

#side-control {
  display:none;  
}

#side-control-wrap {
  text-align:right;
}

#control {
  border-spacing:15px;
  margin:auto;
  text-align:center;
  opacity:.6;
} 

#control td {
    margin-left:10px;
    margin-right:10px;
    margin-top:10px;
    width: 60px;
    height: 60px;
    background-position:center;
    background-repeat: no-repeat;    
    background-size: 60px 60px;
 }

#again {
    display:none;
    text-align:center;
    position:absolute;
    left:0;
    right:0;
    top:10%;
    bottom:0;
}

#donate {
  position:absolute;
  text-align:left;
  bottom:0; 
  opacity:.5;
  z-index:100;
}

#scoreboard {    
    margin:auto;
    font-size:150%;
    background: rgba(247, 239, 215, 0.9); 
    color: rgba(148, 106, 80, 0.9);
    text-shadow:3px -4px 7px rgba(199,199,199,0.8);
    border: dotted #b5a759;
    text-align:center;
    font-family:serif;
    font-weight: bold;
    box-shadow: 2px -2px 20px 2px rgba(0, 0, 0, 0.46);
}

#socreboard p {
  padding:0;
  margin:2%px;
  width:100%
}

// Turns the ascii art in `shapes` into 2d arrays the game can work with.
class Shapes {
   static make()
   {
      for(var p=0; p<Object.keys(shapes).length; p++)
      {
         var key = Object.keys(shapes)[p];
         for(var s=0; s<shapes[key].length; s++)
               shapes[key][s].s = Shapes.makeShape(shapes[key][s].s);
      }
   }

   static makeShape(shape)
   {
      var x=0;
      var y=0;
      var maxX=0;
      for(var c=0; c<shape.length; c++)
      {
        if (shape[c]=='\n') { y++; maxX=Math.max(x, maxX); x=0; } else { x++; }
      }
      maxX=Math.max(x, maxX);

      var s=new Array(y);
      y=-1; x=0;
      for(var c=0; c<shape.length; c++)
      {
        if (shape[c]=='\n') {
           x=0; y++;
           s[y]=new Array(maxX);
        }
        else {
           if (shape[c]=='*') s[y][x]=shape[c];
           x++;
        }
      }
      return s;
   }

   // TAK, H (heart) and THAI pieces crumble like sand when they land
   static isSpecial(key)
   {
      return key=="TAK" || key=="H" || key=="THAI";
   }
}

function getRandomInt(min, max) {
  min = Math.ceil(min);
  max = Math.floor(max);
  return Math.floor(Math.random() * (max - min)) + min; //The maximum is exclusive and the minimum is inclusive
}

Number.prototype.pad = function(size) {
   var s = String(this);
   while (s.length < (size || 2)) {s = "0" + s;}
   return s;
}

// A table of cells: the main well or the little "next" preview.
class Well {
   constructor(selector)
   {
      this.el = $(selector);
      this.cells = [];
   }

   init(x, y, size)
   {
      var well = this.el;
      well.find("tr").each(function() { $(this).remove(); });
      this.cells = [];
      for(var i=0; i<y; i++)
      {
         var tr=$("<tr/>");
         well.append(tr);
         this.cells[i] = [];
         for(var j=0; j<x; j++)
         {
           var td = $("<td/>");
           td.addClass("_"+i+"_"+j);
           td.attr("data-x",j);
           td.attr("data-y",i);
           tr.append(td);
           this.cells[i][j] = td[0];
         }
      }
      well.find("td").css("height", size);
      well.find("td").css("width", size);
   }

   // cells are kept in this.cells instead of being looked up by class name every time
   getCell(x,y)
   {
      var row = this.cells[Number(y)];
      return $(row ? row[Number(x)] : null);
   }

   paintShape(shape, org, color, show)
   {
     for(var y=0; y< shape.length; y++)
        for(var x=0; x< shape[y].length; x++)
           if (shape[y][x]=='*') {
               var cell = this.getCell((org.x+x),(org.y+y))
               if (show) cell.addClass("nonempty").addClass("shape").attr("data-color",color);
                  else cell.removeClass("nonempty").removeClass("shape").attr("data-color","");
           }
   }

   // moves every cell of the current shape down one row if it can; true while anything moved
   collapseShape()
   {
      var well = this;
      var result = false;
      var shape = this.el.find(".shape");
      shape.sort(function(a,b) {
             var y1 = Number($(a).attr("data-y"));
             var y2 = Number($(b).attr("data-y"));
             return (y1<y2) ? 1 : (y1>y2) ? -1 :0;
      });

      shape.each(function() {
          var cell = $(this);
          if (cell.hasClass("nonempty")) {
             var x = Number(cell.attr("data-x"));
             var y = Number(cell.attr("data-y"));

             var belowCell = well.getCell(x, y+1);
             if (belowCell.length && !$(belowCell).hasClass("nonempty")) {
                 belowCell.addClass("nonempty").addClass("shape").attr("data-color", cell.attr("data-color"));
                 cell.removeClass("nonempty").removeClass("shape").removeAttr("data-color");
                 result = true;
             }
         }
      });
      return result;
   }
}

class Game {
   constructor()
   {
      this.wellSize = { width: 10, height: 20 };
      this.nextShp = 0;
      this.nextR = 0;
      this.nextCur = 0;
      this.cur = 0;
      this.shp = 0;
      this.r = 0;
      this.pt = { x:0, y:0 };
      this.spd = 800;
      this.timer = null;
      this.score = 0;
      this.takMoved = false;
      this.isCollapsing = false;
      this.inPlay = false;
      this.elapsedTimer = null;
      this.well = new Well("#well");
      this.nextWell = new Well("#next-well");
   }

   start()
   {
      Shapes.make();
      this.controls = new Controls(this);
      this.initWell();
      this.nextShape();
      this.paintShape(true);
      this.reset();
      setInterval(() => {
          this.spd=Math.max(300,this.spd-10);
      }, 10000);
   }

   initWell()
   {
      var height = $("body").height();
      if ($("#bottom-control").is(":visible")) {
         height-=$("#bottom-control").height();
      }
      height/=this.wellSize.height;

      this.well.init(this.wellSize.width, this.wellSize.height, height);

      $("#sidebar").css("font-size", Math.max(6, 1.2*height)+"px");
      $("#elapsed").css("font-size", Math.max(6, 0.8*height)+"px");

      $("#again").css("font-size", Math.max(6, 0.8*height)+"px");
      $("#scoreboard").css("border-width", Math.max(5, 0.5*height)+"px");

      var donate = $("#donate form input[type='image']");
      var ratio=donate.width()/donate.height();
      donate.height(height*.7);
      donate.width(ratio*height*.7);
   }

   nextShape()
   {
      this.takMoved = false;

      var paintShp = this.nextShp;
      var paintCur = this.nextCur;
      var paintR;

      this.cur = this.nextCur;
      this.shp = this.nextShp;
      this.r = this.nextR;

      this.nextWell.paintShape(this.nextCur, { x:0, y:0 }, Object.keys(shapes)[this.nextShp], false);

      var isAlmostEmpty = this.getCell(0,16).closest("tr").find("td").closest(".nonempty").length == 0;
      do {
        this.nextShp = getRandomInt(0, Object.keys(shapes).length);
        this.nextR = getRandomInt(0, shapes[Object.keys(shapes)[this.nextShp]].length);
        if (Object.keys(shapes)[this.nextShp]=="TAK") this.nextR = 0;
        this.nextCur = shapes[Object.keys(shapes)[this.nextShp]][this.nextR].s;
        if (Shapes.isSpecial(Object.keys(shapes)[this.nextShp])) {
           if (!isAlmostEmpty) continue;
           paintShp = getRandomInt(0, Object.keys(shapes).length-2);
           paintCur = shapes[Object.keys(shapes)[paintShp]][0].s;
           paintR = 0;
        }
        else
        {
           paintShp = this.nextShp;
           paintCur = this.nextCur;
           paintR = this.nextR;
        }
        break;
      } while (true);

      var height = this.getCell(0,0).height();
      this.nextWell.init(paintCur[0].length, paintCur.length, height);
      this.nextWell.paintShape(paintCur, {x: 0, y: 0}, Object.keys(shapes)[paintShp], true);
   }

   getOrigin(respectOrigin, key, r)
   {
      if (!respectOrigin) return { x:this.pt.x, y:this.pt.y };
      var key = Object.keys(shapes)[this.shp];
      var org=shapes[key][r].org;
      return { x: this.pt.x-org.x, y:this.pt.y-org.y };
   }

   rotateShape()
   {
      if (this.isCollapsing) return;
      var key = Object.keys(shapes)[this.shp];
      for(var i=1; i<shapes[key].length; i++) {
         var newR=(this.r+i)%shapes[key].length;
         if (key=="TAK" && newR == 0) {
            newR = 1;
         }
         var newCur=shapes[key][newR].s;
         var org=this.getOrigin(!this.takMoved, key, newR);
         if (this.isValidPos(newCur, org)) {
            this.paintShape(false);
            this.cur=newCur;
            this.r=newR;
            this.paintShape(true);
            break;
         }
      }
   }

   isValidPos(shape, pt)
   {
      if (pt.x<0 || pt.x+shape[0].length>this.wellSize.width) return false;
      if (pt.y+shape.length>this.wellSize.height) return false;

      for(var y=0; y<shape.length; y++) {
        for(var x=0; x<shape[y].length; x++) {
           var cell = this.getCell(pt.x+x,pt.y+y);
           if (shape[y][x]=='*' && cell.hasClass("nonempty") && !cell.hasClass("shape")) return false;
        }
      }
      return true;
   }

   collapseShape()
   {
      this.isCollapsing = this.well.collapseShape();
      return this.isCollapsing;
   }

   changeShape()
   {
      this.paintShape(false);
      this.shp=(this.shp+1)%Object.keys(shapes).length;
      this.r=0;
      var key = Object.keys(shapes)[this.shp];
      this.cur=shapes[key][this.r].s;
      this.paintShape(true);
   }

   playGame()
   {
       this.inPlay = true;
       if (!this.moveShape(0,1)) {
           if (Shapes.isSpecial(Object.keys(shapes)[this.shp])) {
              if (this.collapseShape()) return;
           }
           this.restShape();
       };
   }

   restShape()
   {
       if (Shapes.isSpecial(Object.keys(shapes)[this.shp])) {
          while(this.collapseShape());
       }
       this.embedShape();
       this.removeLines();
       var org = shapes[Object.keys(shapes)[this.shp]][this.r].org;
       if ((this.pt.y-org.y)<=0)
       {
          this.inPlay = false;
          clearInterval(this.timer);
          this.showResetButton();
          return;
       }
       var oldTimer = this.timer;
       this.timer = setInterval(() => this.playGame(), this.spd);
       clearInterval(oldTimer);
       this.nextShape();
       this.releaseShape();
       this.paintShape(true);
   }

   releaseShape()
   {
       var key = Object.keys(shapes)[this.shp];
       var org = shapes[key][this.r].org;
       this.pt.x=Math.floor((this.wellSize.width-this.cur[0].length) / 2)+org.x;
       this.pt.y=-this.cur.length;
   }

   dropShape()
   {
       if (!this.inPlay) return;
       while(this.moveShape(0,1));
       this.restShape();
   }

   embedShape()
   {
       this.well.el.find(".shape").removeClass("shape");
   }

   showResetButton()
   {
      var time = $("#elapsed").text();
      $("#scoreboard").html("<p>Score <b>"+this.score+" pts</b></p><p>Time <b>"+time+"</b></p><p>TRY AGAIN!</p>");
      $("#again").show();
   }

   showElapsedTime(startTime)
   {
       if (!this.inPlay) return;
       var today = new Date().getTime();
       var h = Math.floor((today-startTime) / (1000*60*60));
       var m = Math.floor((today-startTime) / (1000*60)) % 60;
       var s = Math.floor((today-startTime) / 1000) % 60;

       $("#elapsed").text((h ? h + ":" + m.pad(2) : m) + ":" + s.pad(2));

       this.elapsedTimer = setTimeout(() => {
          this.showElapsedTime(startTime)
       }, 1000);
   }

   getCell(x,y)
   {
     return this.well.getCell(x,y);
   }

   moveShape(dx,dy)
   {
      if (this.isCollapsing) return false;
      var key = Object.keys(shapes)[this.shp];
      var ptOrg = this.getOrigin(!this.takMoved, key, this.r);
      if (!this.isValidPos(this.cur, { x: ptOrg.x+dx, y: ptOrg.y+dy })) return false;
      this.paintShape(false);
      this.pt.x+=dx;
      this.pt.y+=dy;
      if (!this.takMoved) {
          this.takMoved = (key=="TAK" && dx !=0 )
          this.pt = this.getOrigin(this.takMoved, key, this.r);
      }
      this.paintShape(true);
      return true;
   }

   removeLines()
   {
      var ctLines = 0;
      var lineScore = 0;

      for(var yy=this.wellSize.height-1 ;yy>=0;yy--)
      {
         var line = this.getCell(0, yy).closest("tr").find("td");
         var blocks = line.closest(".nonempty");
         if (blocks.length==0) break;
         if (blocks.length==this.wellSize.width)
         {
            blocks.each(function() { lineScore += Math.max(0, Object.keys(shapes).indexOf($(this).attr("data-color"))); });
            ctLines++;
            for(var y=yy;y>0; y--)
            {
               var lineAbove = this.getCell(0, y-1).closest("tr").find("td");
               var aboveIsEmpty = lineAbove.closest(".nonempty").length == 0;
               for(var c=0; c<this.wellSize.width; c++) {
                 if ($(lineAbove[c]).hasClass("nonempty")) {
                    $(line[c]).addClass("nonempty");
                    $(line[c]).attr("data-color",$(lineAbove[c]).attr("data-color"));
                 }
                 else {
                    $(line[c]).removeClass("nonempty");
                    $(line[c]).removeAttr("data-color");
                 }
               }
               line=lineAbove;
               if (aboveIsEmpty) break;
            }
            yy++;
         }
      }
      if (!lineScore) lineScore = 1;
      if (ctLines==4) lineScore*=2;
      this.score += lineScore;
      $("#sidebar").text(this.score.pad(4));
   }

   paintShape(on)
   {
      var key = Object.keys(shapes)[this.shp];
      var org = this.getOrigin(!this.takMoved, key, this.r);
      this.well.paintShape(this.cur, org, key, on);
   }

   reset()
   {
       $("#again").hide();
       clearInterval(this.timer);
       clearTimeout(this.elapsedTimer);
       this.well.el.find(".nonempty").removeClass("nonempty").removeClass("shape");
       this.score = 0;
       $("#sidebar").text(this.score.pad(4));
       this.nextShape();
       /*
       this.shp=Object.keys(shapes).indexOf("TAK");
       this.r = 0;
       this.cur = shapes["TAK"][this.r].s;
       */
       this.releaseShape();
       this.spd = 1000;
       this.timer = setInterval(() => this.playGame(), this.spd);
       this.inPlay = true;
       this.showElapsedTime(new Date().getTime());
       this.well.el.focus();
   }
}

// Keyboard and on-screen buttons.
class Controls {
   constructor(game)
   {
      this.game = game;
      this.initControl();
      this.initKeys();
   }

   initControl()
   {
      var game = this.game;
      $("#left").click(function() { game.moveShape(-1,0); });
      $("#right").click(function() { game.moveShape(1,0); });
      $("#rotate").click(function() { game.rotateShape(); });
      $("#drop").click(function() { game.dropShape(); });
      $("#well").click(function() { game.moveShape(0,1); });

      var controlClone = $("#control").clone(true);
      $("#side-control").append(controlClone);

      var doc = $(document);
      if (doc.height() >= doc.width()) {
         $("#bottom-control").show();
         $("#side-control-wrap").hide();
      } else {
         $("#side-control").css('display', 'inline-block');
      }

      $("#scoreboard").click(function() { game.reset(); });
   }

   initKeys()
   {
      var game = this.game;
      $("#well").keydown(function(event) {
         switch(event.originalEvent.code)
         {
            case "ArrowRight": {
               event.preventDefault();
               game.moveShape(1,0);break;
            }
            case "ArrowLeft": {
               event.preventDefault();
               game.moveShape(-1,0);break;
            }
            case "ArrowUp": {
               event.preventDefault();
               game.rotateShape();break;
            }
            case "ArrowDown": {
               event.preventDefault();
               if (game.inPlay) game.playGame();
               break;
            }
            case "Space": {
               event.preventDefault();
               if (!game.inPlay) {
                  game.reset();
               } else {
                  game.dropShape();
               }
               break;
            }
         }
      });
   }
}

var game = new Game();
game.start();
</script>
